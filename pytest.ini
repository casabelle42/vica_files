[pytest]
testpaths =
    Network/test_suite
    Edge/test_suite
    Host_Team/test_suite
    Host_Team/auth_api/test_suite
python_files = test_*.py
addopts = -ra
markers =
    integration: cross-component tests using in-process fakes (no real network/hardware)
    regression: locks in fragile/critical current behavior
    slow: slower tests (real thread timing)
